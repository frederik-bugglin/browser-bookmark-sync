appId: app.junction.bookmarksync
productName: Junction
copyright: Copyright (c) 2026 Frederik Bugglin

directories:
  buildResources: assets
  output: dist

files:
  - dist-electron/**/*
  - out/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: assets
    to: assets
    filter:
      - "*.png"
      - "*.icns"

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  identity: null

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

asar: true
